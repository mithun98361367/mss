<!DOCTYPE html>

<title>MSS WEB SOLUTIONS</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    /* MENU */
    .menu {
      height: 55px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: 
	   linear-gradient(
            135deg,
            #ffd052,
            #e8ae2f
        );
    }

    .menu button {
      border: none;
      background: transparent;
      color: white;
      padding: 10px 16px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }

    .menu button:hover {
      background: rgba(255,255,255,0.18);
    }

    .menu button.active {
      background: white;
      color: #1a73e8;
    }

    /* CONTENT */
    .content {
      height: calc(100vh - 55px);
      width: 100%;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
	
#footer,
.wsite-footer {
    display: none !important;
}

#main {
    min-height: 100vh !important;
}
