<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
   content="width=device-width, initial-scale=1.0">

<meta name="description"
   content="MSS Web Solutions">

<title>MSS WEB SOLUTIONS</title>

<style>

/* =====================================================
   RESET
===================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;

    font-family:
        "Segoe UI",
        Arial,
        sans-serif;

    background: #f5f7fb;
    color: #172033;

    overflow: hidden;
}


/* =====================================================
   HEADER
===================================================== */

.header {

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;
    height: 74px;

    z-index: 1000;

    background:
        rgba(255,255,255,.97);

    border-bottom:
        1px solid #e7eaf0;

    box-shadow:
        0 3px 18px rgba(15,23,42,.08);
}


.nav-container {

    width: min(1200px, 94%);

    height: 74px;

    margin: auto;

    display: flex;

    align-items: center;

    justify-content: space-between;
}


/* =====================================================
   LOGO
===================================================== */

.logo {

    text-decoration: none;

    color: #172033;

    font-size: 20px;

    font-weight: 800;

    letter-spacing: 1px;

    white-space: nowrap;
}

.logo span {

    color: #1d4fa3;
}


/* =====================================================
   NAVIGATION
===================================================== */

.nav {

    display: flex;

    align-items: center;

    gap: 8px;
}


.nav button {

    border: none;

    background: transparent;

    color: #344054;

    padding: 10px 14px;

    border-radius: 8px;

    font-family: inherit;

    font-size: 14px;

    font-weight: 700;

    cursor: pointer;

    transition:
        background .25s ease,
        color .25s ease,
        transform .25s ease;
}


.nav button:hover {

    background: #eef3ff;

    color: #1d4fa3;

    transform: translateY(-1px);
}


.nav button.active {

    background: #1d4fa3;

    color: white;

    box-shadow:
        0 5px 14px rgba(29,79,163,.22);
}


/* =====================================================
   MOBILE MENU BUTTON
===================================================== */

.menu-btn {

    display: none;

    width: 42px;
    height: 42px;

    border: none;

    border-radius: 9px;

    background: #1d4fa3;

    color: white;

    font-size: 21px;

    cursor: pointer;
}


/* =====================================================
   HOME
===================================================== */

#home {

    position: fixed;

    top: 74px;
    left: 0;
    right: 0;
    bottom: 0;

    padding: 30px;

    overflow: auto;

    background: #f5f7fb;
}





/* =====================================================
   HOME CARD
===================================================== */

.card {

    width: min(700px, 100%);

    margin: 30px auto;

    padding: 30px;

    background: white;

    border-radius: 16px;

    box-shadow:
        0 8px 30px rgba(15,23,42,.08);
}


.card h2 {

    margin-top: 0;
}


.card p {

    color: #667085;

    margin-bottom: 25px;
}


/* =====================================================
   HOME BUTTONS
===================================================== */

.btn {

    border: none;

    background: #1d4fa3;

    color: white;

    padding: 13px 18px;

    border-radius: 8px;

    font-family: inherit;

    font-weight: 700;

    cursor: pointer;
}


.btn:hover {

    background: #163d80;
}


.btn-full {

    width: 100%;

    margin-top: 10px;
}


/* =====================================================
   APPLICATION AREA
===================================================== */

.app-container {

    display: none;

    position: fixed;

    top: 74px;

    left: 0;
    right: 0;
    bottom: 0;

    background: #f5f7fb;
}


.app-container.show {

    display: block;
}


#appFrame {

    width: 100%;
    height: 100%;

    border: none;

 

    background: white;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 1000px) {


    .header {

        height: 65px;
    }


    .nav-container {

        height: 65px;

        width: 100%;

        padding: 0 15px;
    }


    .logo {

        font-size: 17px;
    }


    .menu-btn {

        display: block;
    }


    .nav {

        display: none;

        position: absolute;

        top: 65px;

        left: 0;
        right: 0;

        padding: 10px 14px 15px;

        background: white;

        border-bottom:
            1px solid #e7eaf0;

        box-shadow:
            0 10px 25px rgba(15,23,42,.12);

        flex-direction: column;

        align-items: stretch;

        gap: 5px;
    }


    .nav.show {

        display: flex;
    }


    .nav button {

        width: 100%;

        text-align: left;

        padding: 13px 15px;

        font-size: 14px;
    }


    #home {

        top: 65px;

        padding: 15px;
    }


    .app-container {

        top: 65px;
    }


    .card {

        margin: 15px auto;

        padding: 22px;
    }



}


/* =====================================================
   SMALL MOBILE
===================================================== */

@media (max-width: 450px) {

    .logo {

        font-size: 15px;

        letter-spacing: .5px;
    }


    .menu-btn {

        width: 40px;
        height: 40px;
    }

}









  /* =====================================================
           MAIN
        ===================================================== */

        .services-section {

            padding: 90px 0;
        }


        .services-container {

            width: min(1180px, 92%);

            margin: auto;
        }


        .section-heading {

            text-align: center;

            margin-bottom: 50px;
        }


        .section-heading h2 {

            margin: 0 0 12px;

            font-size: 38px;

            color: #111827;
        }


        .section-heading p {

            max-width: 700px;

            margin: auto;

            color: #667085;

            font-size: 17px;

            line-height: 1.7;
        }


/* =====================================================
   SERVICE SECTION
===================================================== */

.services-section {
    padding: 70px 0;
}

.services-container {
    width: min(1180px, 92%);
    margin: auto;
}

.section-heading {
    text-align: center;
    margin-bottom: 40px;
}

.section-heading h2 {
    margin: 0 0 12px;
    font-size: 38px;
    color: #111827;
}

.section-heading p {
    max-width: 700px;
    margin: auto;
    color: #667085;
    font-size: 17px;
    line-height: 1.7;
}


/* =====================================================
   SERVICE GRID
===================================================== */

.services-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 22px;
}


/* =====================================================
   SERVICE CARD
===================================================== */

.service-card {
    position: relative;

    display: flex;
    flex-direction: column;

    padding: 26px;

    background: #ffffff;

    border: 1px solid #e7eaf0;

    border-radius: 16px;

    box-shadow:
        0 8px 28px rgba(15,23,42,.055);

    transition:
        transform .3s ease,
        box-shadow .3s ease,
        border-color .3s ease;

    min-width: 0;
}


/* Desktop hover */

.service-card:hover {
    transform: translateY(-6px);

    box-shadow:
        0 18px 40px rgba(15,23,42,.11);

    border-color: #d7def0;
}


/* =====================================================
   SERVICE ICON
===================================================== */

.service-icon {
    width: 58px;
    height: 58px;

    display: flex;

    align-items: center;
    justify-content: center;

    flex-shrink: 0;

    border-radius: 14px;

    background: #eef3ff;

    font-size: 27px;

    margin-bottom: 18px;
}


/* =====================================================
   SERVICE TITLE
===================================================== */

.service-card h3 {
    margin: 0 0 10px;

    font-size: 19px;

    line-height: 1.35;

    color: #172033;

    overflow-wrap: anywhere;
}


/* =====================================================
   SERVICE DESCRIPTION
===================================================== */

.service-card p {
    margin: 0;

    color: #667085;

    font-size: 14px;

    line-height: 1.65;

    flex: 1;

    overflow-wrap: anywhere;
}


/* =====================================================
   SERVICE BUTTON
===================================================== */

.service-card .btn {
    width: 100%;

    margin-top: 20px;

    padding: 12px 14px;

    font-size: 14px;

    line-height: 1.3;

    white-space: normal;

    min-height: 44px;
}


/* =====================================================
   TABLET
===================================================== */

@media (max-width: 900px) {

    .services-section {
        padding: 50px 0;
    }

    .services-container {
        width: min(700px, 92%);
    }

    .section-heading {
        margin-bottom: 30px;
    }

    .section-heading h2 {
        font-size: 32px;
    }

    .section-heading p {
        font-size: 15px;
    }

    .services-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
    }

    .service-card {
        padding: 22px;
    }

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {

    .services-section {
        padding: 35px 0 50px;
    }

    .services-container {
        width: calc(100% - 24px);
        max-width: 100%;
    }

    .section-heading {
        margin-bottom: 25px;
        padding: 0 5px;
    }

    .section-heading h2 {
        font-size: 26px;
        line-height: 1.25;
    }

    .section-heading p {
        font-size: 14px;
        line-height: 1.55;
    }

    /* ONE CARD PER ROW */

    .services-grid {
        grid-template-columns: 1fr;
        gap: 14px;
    }

    /* MOBILE CARD */

    .service-card {
        width: 100%;
        padding: 20px;

        border-radius: 14px;

        box-shadow:
            0 5px 20px rgba(15,23,42,.06);
    }

    /* Disable lift effect on touch devices */

    .service-card:hover {
        transform: none;

        box-shadow:
            0 5px 20px rgba(15,23,42,.06);
    }

    .service-icon {
        width: 52px;
        height: 52px;

        margin-bottom: 15px;

        border-radius: 12px;

        font-size: 24px;
    }

    .service-card h3 {
        font-size: 18px;
        line-height: 1.35;
        margin-bottom: 8px;
    }

    .service-card p {
        font-size: 14px;
        line-height: 1.6;
    }

    .service-card .btn {
        margin-top: 17px;

        width: 100%;

        min-height: 46px;

        padding: 12px 10px;

        font-size: 13px;

        border-radius: 8px;
    }

}


/* =====================================================
   SMALL MOBILE
===================================================== */

@media (max-width: 380px) {

    .services-container {
        width: calc(100% - 18px);
    }

    .section-heading h2 {
        font-size: 23px;
    }

    .section-heading p {
        font-size: 13px;
    }

    .service-card {
        padding: 17px;
    }

    .service-icon {
        width: 48px;
        height: 48px;
        font-size: 22px;
    }

    .service-card h3 {
        font-size: 17px;
    }

    .service-card p {
        font-size: 13px;
    }

    .service-card .btn {
        font-size: 12.5px;
        padding: 11px 8px;
    }

}

 


</style>

</head>

<body>

<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">


<div class="nav-container">


    <!-- LOGO -->

    <a
        href="javascript:void(0)"
        class="logo"
        onclick="window.location.href='index.html'">

        MSS <span>WEB SOLUTIONS</span>

    </a>


    <!-- NAVIGATION -->

    <nav
        id="mainNav"
        class="nav">

  <button
        onclick="window.location.href='demo.html'">
       📊 Dashboard
    </button>
	
	
	 <button
      class="active"
      onclick="openPage('home', this)">
      📍 Location tracker
    </button>

    <button
      onclick="openPage('direction', this)">
      📊 Location Directions
    </button>

    <button
      onclick="openPage('admin', this)">
      📈 Admin
    </button>
	
	   
    </nav>


    <!-- MOBILE BUTTON -->

    <button
        class="menu-btn"
        type="button"
        onclick="toggleMenu()"
        aria-label="Open Menu">

        ☰

    </button>


</div>


</header>




<!-- =====================================================
     APPLICATION IFRAME
===================================================== -->

<main
    id="appContainer"
    class="app-container">


<iframe
    id="appFrame"
    title="Engineer Application"
    allow="geolocation; camera; microphone">
</iframe>


</main>

<script>
const APP_URL =
  "https://script.google.com/macros/s/AKfycbzixV8lqMWWcYv_GxpEU6EizEYuBHvHhQy5MUUILg1RtlAH-qUVCpi8I0tPgKPxZfg1PQ/exec";

const frame = document.getElementById("appFrame");
const container = document.getElementById("appContainer");
const nav = document.getElementById("mainNav");


function openPage(page, button) {

    let url;

    switch (page) {

        case "home":
            url = APP_URL;
            break;

        case "direction":
            url = APP_URL + "?page=direction";
            break;

        case "admin":
            url = APP_URL + "?page=admin";
            break;

        default:
            return;
    }

    container.classList.add("show");

    if (frame.src !== url) {
        frame.src = url;
    }

    clearActiveButtons();

    if (button) {
        button.classList.add("active");
    }

    nav.classList.remove("show");
}


function clearActiveButtons() {

    document.querySelectorAll("#mainNav button")
        .forEach(function(button) {
            button.classList.remove("active");
        });
}


function toggleMenu() {
    nav.classList.toggle("show");
}


document.addEventListener("click", function(event) {

    const menuButton = document.querySelector(".menu-btn");

    if (
        nav.classList.contains("show") &&
        !nav.contains(event.target) &&
        !menuButton.contains(event.target)
    ) {
        nav.classList.remove("show");
    }

});


// Automatically open All Calls Data on page load
window.addEventListener("DOMContentLoaded", function() {

    const firstButton = document.querySelector(
        '#mainNav button[onclick*="home"]'
    );

    openPage("home", firstButton);

});
</script>


</body>

</html>
